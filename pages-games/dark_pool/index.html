<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dark Pool</title>
    <script>window.__DARK_POOL_PLATFORM__ = "yandexgames";</script>
    
    
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05060a;
            color: #e2e8f0;
            font-family: 'Montserrat', 'Georgia', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            position: relative;
        }

        /* ХОЛСТ ВСЕГДА ЗАНИМАЕТ ОКНО ЦЕЛИКОМ. Игра рисуется в альбомном кадре,
           а окно может быть портретным, и кадр вписывается в него через
           object-fit: contain. Вписывание делает БРАУЗЕР: элемент остаётся
           размером с окно, и обрезать просто нечего.
           Раньше вписывание делал JavaScript, задавая размеры элемента, и в
           портрете кадр уезжал за правый и нижний край — правую часть экрана
           поражения было не видно, а до неё нельзя было дотянуться. */
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            background-color: #05060a;
            border: none;
            box-shadow: none;
            outline: none;
            object-fit: contain;
            /* Телефон не должен прокручивать страницу и зумить её под пальцем:
               страница и так не прокручивается, но браузер всё равно тянет
               экран жестом. Игровые органы управления ловят касания сами. */
            touch-action: none;
        }

        /* Кнопка во весь экран. Живёт НАД холстом и в углу ОКНА, а не в углу
           игрового кадра: в портрете игровой кадр — полоса посередине, и
           кнопка в её углу была бы до кнопки не дотянуться.

           На компьютере кнопка крупная: мышью в неё целятся без прицела.
           На телефоне — мелкая: палец в неё попадает по нему, а место на
           экране занимает палец, а не кнопка. Режим телефона игра помечает
           классом touch-mode на теле (см. TouchControls). */
        #fullscreenBtn {
            position: fixed;
            top: calc(8px + env(safe-area-inset-top, 0px));
            right: calc(8px + env(safe-area-inset-right, 0px));
            z-index: 10;
            width: 56px;
            height: 56px;
            padding: 0;
            font-size: 28px;
            line-height: 1;
            color: #cbd5e1;
            background: rgba(12, 10, 20, 0.55);
            border: 1px solid rgba(148, 163, 184, 0.45);
            border-radius: 10px;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        /* Телефон: кнопка мельче и не отвлекает от боя. */
        body.touch-mode #fullscreenBtn {
            width: 34px;
            height: 34px;
            font-size: 17px;
            border-radius: 8px;
            opacity: 0.75;
        }

        #fullscreenBtn:hover,
        #fullscreenBtn:focus-visible {
            color: #00ffcc;
            border-color: rgba(0, 255, 204, 0.8);
            outline: none;
        }

        #fullscreenBtn:active {
            background: rgba(0, 255, 204, 0.22);
        }

        /* Кнопка не должна перехватывать жесты игры, но и не должна
           перерисовываться поверх кадра мигающим. */
        #fullscreenBtn[hidden] {
            display: none;
        }
        .menu-tools {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 12px);
            left: calc(env(safe-area-inset-left, 0px) + 12px);
            z-index: 12;
            display: none;
            align-items: center;
            gap: 7px;
            pointer-events: auto;
        }
        body.menu-visible .menu-tools {
            display: flex;
        }
        .menu-tools button {
            min-height: 38px;
            padding: 0 12px;
            border: 1px solid rgba(210, 179, 113, 0.45);
            border-radius: 4px;
            background: rgba(12, 10, 20, 0.76);
            color: #e4d7bd;
            font: 700 11px/1 'Montserrat', 'Georgia', sans-serif;
            letter-spacing: 0.06em;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .menu-tools button:hover,
        .menu-tools button:focus-visible {
            border-color: #d2b371;
            color: #fff4d8;
            outline: none;
        }
        body.platform-crazygames #fullscreenBtn {
            display: none !important;
        }
        .brand-badge {
            position: fixed;
            left: calc(env(safe-area-inset-left, 0px) + 12px);
            bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
            z-index: 11;
            display: none;
            align-items: center;
            gap: 6px;
            box-sizing: border-box;
            min-height: 28px;
            padding: 0 7px;
            border: 1px solid rgba(251, 249, 244, 0.14);
            border-radius: 4px;
            background: rgba(17, 17, 17, 0.58);
            color: rgba(251, 249, 244, 0.72);
            font: 600 10px/1.1 system-ui, sans-serif;
            opacity: 0.62;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
        }
        body.brand-menu-visible .brand-badge {
            display: inline-flex;
        }
        .brand-badge img {
            display: block;
            width: 14px;
            height: 14px;
        }
    
        /* Защита от системных жестов: требование 1.14 Яндекс Игр. */
        html, body {
            touch-action: none;
            overscroll-behavior: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* Пока игра не сняла оверлей, жест по нему не должен проваливаться в canvas. */
        #boot {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #05060a;
            color: #94a3b8;
            font: 600 14px 'Montserrat', 'Georgia', sans-serif;
            letter-spacing: 0.2em;
            z-index: 10;
            /* Клики проходят насквозь: оверлей не имеет права перехватывать ввод. */
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="boot">ЗАГРУЗКА</div>
    <script>
        // Оверлей снимается первым отрисованным кадром игры. Игровой цикл стартует
        // из DOMContentLoaded, который наступает раньше load, поэтому к моменту
        // load цикл уже работает, а двойной requestAnimationFrame гарантирует,
        // что кадр не просто запланирован, а показан.
        window.addEventListener("load", function () {
            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    var boot = document.getElementById("boot");
                    if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
                });
            });
        });
    </script>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="menu-tools" aria-label="Настройки игры">
        <button id="languageBtn" type="button" aria-label="Сменить язык на английский" title="Язык">RU</button>
        <button id="audioBtn" type="button" aria-label="Выключить звук" title="Звук">ЗВУК: ВКЛ</button>
    </div>
    <div class="brand-badge"><img src="assets/brand-mark.svg" alt="" aria-hidden="true"><span>Indie Game Forge</span></div>
    <button id="fullscreenBtn" type="button" title="Во весь экран" aria-label="Во весь экран">⛶</button>
    <script src="game.js" defer></script>
</body>
</html>
