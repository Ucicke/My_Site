<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#171923" />
  <meta name="description" content="Merge RPG — фэнтезийная RPG о слиянии предметов. Игра пока в разработке." />
  <title>Merge RPG — в разработке</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background: #171923; color: #f1ecf8; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 28px; background: radial-gradient(ellipse at 50% 38%, #382c4b 0%, #20202a 42%, #121719 100%); }
    main { width: min(100%, 720px); padding: clamp(32px, 7vw, 72px); border: 1px solid #e4d5ff28; background: #171923d9; box-shadow: 0 32px 100px #07070c80; }
    .eyebrow { margin: 0 0 28px; color: #c6b4ec; font: 11px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(48px, 11vw, 90px); line-height: .95; letter-spacing: -.07em; font-weight: 750; }
    h1 span { color: #d9bd7c; }
    .status { display: flex; align-items: center; gap: 10px; margin: 30px 0 14px; color: #e6d3a4; font: 11px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #d8b46f; box-shadow: 0 0 16px #d8b46f99; }
    p { max-width: 480px; margin: 0; color: #b8b4c2; font-size: 16px; line-height: 1.75; }
    a { display: inline-flex; align-items: center; gap: 20px; margin-top: 38px; padding: 14px 17px; border: 1px solid #d6c9ed50; color: #f2edfb; text-decoration: none; font-size: 13px; transition: background .2s ease, border-color .2s ease; }
    a:hover, a:focus-visible { border-color: #d7c2ff; background: #d7c2ff18; }
    a span { color: #d9bd7c; transition: transform .2s ease; }
    a:hover span { transform: translateX(3px); }
    a:focus-visible { outline: 2px solid #d7c2ff; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">UCICKE / ИГРА № 06</p>
    <h1>Merge<br />RPG<span>.</span></h1>
    <p class="status">Проект в разработке</p>
    <p>Собираю фэнтезийный мир, в котором предметы можно объединять, а герой растёт вместе с экипировкой. Страница игры появится, когда проект будет готов к публикации.</p>
    <a href="../">Вернуться к проектам <span aria-hidden="true">↗</span></a>
  </main>
</body>
</html>
